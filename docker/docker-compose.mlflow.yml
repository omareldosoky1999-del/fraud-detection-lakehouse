services:
  spark-master:
    depends_on:
      mlflow: {condition: service_healthy}
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_CONFIG: /app/config/ml_models.yml
      MLFLOW_MODEL_ALIAS: production
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://mlflow-rustfs:9000

  spark-worker:
    depends_on:
      spark-master: {condition: service_started}
      mlflow: {condition: service_healthy}
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_CONFIG: /app/config/ml_models.yml
      MLFLOW_MODEL_ALIAS: production
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://mlflow-rustfs:9000

  mlflow-rustfs:
    image: rustfs/mlflow-rustfs:1.0.0-rc.6
    container_name: rustfs-mlops
    command: server /data --address "0.0.0.0:9000" --console-address "0.0.0.0:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports: ["9100:9000", "9101:9001"]
    volumes:
      - mlflow_rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health && curl -fsS http://localhost:9001/rustfs/console/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [fraud-net]
    profiles: [mlops]
    restart: unless-stopped

  mlflow-rustfs-init:
    image: amazon/aws-cli:2.36.44
    container_name: mlflow-rustfs-init-mlops
    depends_on:
      mlflow-rustfs: {condition: service_healthy}
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        aws --endpoint-url http://mlflow-rustfs:9000 s3api head-bucket --bucket mlflow-artifacts >/dev/null 2>&1 ||
        aws --endpoint-url http://mlflow-rustfs:9000 s3 mb s3://mlflow-artifacts;
        aws --endpoint-url http://mlflow-rustfs:9000 s3 ls
    networks: [fraud-net]
    profiles: [mlops]

  mlflow-postgres:
    image: postgres:16.15-alpine3.23
    container_name: mlflow-postgres
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow-dev-password
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fraud-net]
    profiles: [mlops]
    restart: unless-stopped

  mlflow:
    build:
      context: ./mlflow
      args:
        MLFLOW_VERSION: "3.16.0"
    container_name: mlflow
    ports: ["5000:5000"]
    environment:
      MLFLOW_HOST: 0.0.0.0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://mlflow-rustfs:9000
      MLFLOW_S3_IGNORE_TLS: "true"
      # MLflow 3.5+ Host validation remains enabled.
      MLFLOW_SERVER_ALLOWED_HOSTS: "localhost,localhost:*,mlflow,mlflow:5000,127.0.0.1,127.0.0.1:*"
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "http://localhost:*"
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql://mlflow:mlflow-dev-password@mlflow-postgres:5432/mlflow
      - --artifacts-destination
      - s3://mlflow-artifacts
    depends_on:
      mlflow-postgres: {condition: service_healthy}
      mlflow-rustfs-init: {condition: service_completed_successfully}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - mlflow_data:/mlflow
    networks: [fraud-net]
    profiles: [mlops]
    restart: unless-stopped

volumes:
  mlflow_postgres_data:
  mlflow_data:
  mlflow_rustfs_data:
