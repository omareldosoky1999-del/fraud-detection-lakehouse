services:
  spark-master:
    environment:
      OPENLINEAGE_ENABLED: "true"
      OPENLINEAGE_URL: http://marquez:5000
      OPENLINEAGE_ENDPOINT: /api/v1/lineage
      OPENLINEAGE_NAMESPACE: fraud_detection
      OPENLINEAGE_TIMEOUT_MS: "5000"
    depends_on:
      marquez: {condition: service_healthy}

  spark-worker:
    environment:
      OPENLINEAGE_ENABLED: "true"
      OPENLINEAGE_URL: http://marquez:5000
      OPENLINEAGE_ENDPOINT: /api/v1/lineage
      OPENLINEAGE_NAMESPACE: fraud_detection
      OPENLINEAGE_TIMEOUT_MS: "5000"
    depends_on:
      spark-master: {condition: service_started}
      marquez: {condition: service_healthy}

services:
  marquez-db:
    image: postgres:14
    container_name: marquez-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      MARQUEZ_DB: marquez
      MARQUEZ_USER: marquez
      MARQUEZ_PASSWORD: marquez
    volumes:
      - marquez_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [fraud-net]
    profiles: [lineage]
    restart: unless-stopped

  marquez:
    image: marquezproject/marquez:0.51.1
    container_name: marquez
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
      SEARCH_ENABLED: "false"
    ports:
      - "5002:5000"
      - "5003:5001"
    depends_on:
      marquez-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -fsS http://localhost:5001/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [fraud-net]
    profiles: [lineage]
    restart: unless-stopped

  marquez-web:
    image: marquezproject/marquez-web:0.51.1
    container_name: marquez-web
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: "5000"
      REACT_APP_ADVANCED_SEARCH: "false"
    ports:
      - "3001:3000"
    depends_on:
      marquez: {condition: service_healthy}
    networks: [fraud-net]
    profiles: [lineage]
    restart: unless-stopped

  airflow:
    environment:
      AIRFLOW__OPENLINEAGE__NAMESPACE: fraud_detection
      AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type":"http","url":"http://marquez:5000","endpoint":"api/v1/lineage"}'
    depends_on:
      marquez: {condition: service_healthy}

  spark-master-lineage-config:
    image: alpine/curl:8.22.0
    container_name: spark-master-lineage-config
    depends_on:
      marquez: {condition: service_healthy}
    command: ["/bin/sh", "-c", "echo 'OpenLineage backend is healthy at http://marquez:5000'"]
    networks: [fraud-net]
    profiles: [lineage]

volumes:
  marquez_db_data:
