services:
  spark-master:
    depends_on:
      polaris-setup: {condition: service_completed_successfully}
    environment:
      ICEBERG_ENABLED: "true"
      ICEBERG_CATALOG_NAME: polaris
      POLARIS_URI: http://polaris:8181/api/catalog
      POLARIS_WAREHOUSE: fraud
      POLARIS_CREDENTIAL: root:s3cr3t
      ICEBERG_S3_ENDPOINT: http://minio:9000
      ICEBERG_S3_ACCESS_KEY: polaris_root
      ICEBERG_S3_SECRET_KEY: polaris_pass

  spark-worker:
    depends_on:
      spark-master: {condition: service_started}
      polaris-setup: {condition: service_completed_successfully}
    environment:
      ICEBERG_ENABLED: "true"
      ICEBERG_CATALOG_NAME: polaris
      POLARIS_URI: http://polaris:8181/api/catalog
      POLARIS_WAREHOUSE: fraud
      POLARIS_CREDENTIAL: root:s3cr3t
      ICEBERG_S3_ENDPOINT: http://minio:9000
      ICEBERG_S3_ACCESS_KEY: polaris_root
      ICEBERG_S3_SECRET_KEY: polaris_pass
  postgres:
    image: postgres:16.15-alpine3.23
    container_name: polaris-postgres
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: polaris-dev-password
    volumes:
      - polaris_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris -d polaris"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fraud-net]
    profiles: [lakehouse]
    restart: unless-stopped

  minio:
    # MinIO is kept as the requested local S3-compatible development adapter.
    # Production deployments use AWS S3 / Azure ADLS Gen2 / GCS instead.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: polaris_root
      MINIO_ROOT_PASSWORD: polaris_pass
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - lakehouse_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [fraud-net]
    profiles: [lakehouse]
    restart: unless-stopped

  minio-init:
    image: amazon/aws-cli:2.36.44
    container_name: minio-init
    depends_on:
      minio: {condition: service_healthy}
    environment:
      AWS_ACCESS_KEY_ID: polaris_root
      AWS_SECRET_ACCESS_KEY: polaris_pass
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket iceberg >/dev/null 2>&1 ||
        aws --endpoint-url http://minio:9000 s3 mb s3://iceberg;
        aws --endpoint-url http://minio:9000 s3 ls
    networks: [fraud-net]
    profiles: [lakehouse]

  polaris:
    image: apache/polaris:1.7.0
    container_name: polaris
    ports: ["8181:8181", "8182:8182"]
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: polaris_root
      AWS_SECRET_ACCESS_KEY: polaris_pass
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: 5
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: polaris-dev-password
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      QUARKUS_OTEL_SDK_DISABLED: "true"
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": '["S3"]'
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks: [fraud-net]
    profiles: [lakehouse]
    restart: unless-stopped

  polaris-setup:
    image: alpine/curl:8.22.0
    container_name: polaris-setup
    depends_on:
      polaris: {condition: service_healthy}
    environment:
      CLIENT_ID: root
      CLIENT_SECRET: s3cr3t
      CATALOG_NAME: fraud
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        TOKEN=$$(curl -fsS -u "$${CLIENT_ID}:$${CLIENT_SECRET}" \
          -d 'grant_type=client_credentials' \
          -d 'scope=PRINCIPAL_ROLE:ALL' \
          http://polaris:8181/api/catalog/v1/oauth/tokens | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
        RESPONSE=$$(curl -sS -o /tmp/catalog.json -w '%{http_code}' \
          -X POST http://polaris:8181/api/management/v1/catalogs \
          -H "Authorization: Bearer $$TOKEN" \
          -H 'Polaris-Realm: POLARIS' \
          -H 'Content-Type: application/json' \
          -d '{"catalog":{"name":"'"$${CATALOG_NAME}"'","type":"INTERNAL","readOnly":false,"properties":{"default-base-location":"s3://iceberg"},"storageConfigInfo":{"storageType":"S3","allowedLocations":["s3://iceberg"],"endpoint":"http://minio:9000","endpointInternal":"http://minio:9000","pathStyleAccess":true,"region":"us-east-1"}}}')
        case "$$RESPONSE" in
          200|201|409) echo "Polaris catalog '$${CATALOG_NAME}' ready (HTTP $$RESPONSE)" ;;
          *) cat /tmp/catalog.json >&2; exit 1 ;;
        esac
    networks: [fraud-net]
    profiles: [lakehouse]

  trino:
    image: trinodb/trino:483
    container_name: trino
    ports: ["8080:8080"]
    environment:
      CLIENT_ID: root
      CLIENT_SECRET: s3cr3t
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    depends_on:
      polaris-setup: {condition: service_completed_successfully}
    networks: [fraud-net]
    profiles: [lakehouse]
    restart: unless-stopped

volumes:
  lakehouse_minio_data:
  polaris_postgres_data: