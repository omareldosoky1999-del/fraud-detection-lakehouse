services:
  spark-master:
    depends_on:
      polaris-setup: {condition: service_completed_successfully}
    environment:
      ICEBERG_ENABLED: "true"
      ICEBERG_CATALOG_NAME: polaris
      POLARIS_URI: http://polaris:8181/api/catalog
      POLARIS_WAREHOUSE: fraud
      POLARIS_CREDENTIAL: root:s3cr3t
      ICEBERG_S3_ENDPOINT: http://rustfs:9000
      ICEBERG_S3_ACCESS_KEY: rustfsadmin
      ICEBERG_S3_SECRET_KEY: rustfsadmin

  spark-worker:
    depends_on:
      spark-master: {condition: service_started}
      polaris-setup: {condition: service_completed_successfully}
    environment:
      ICEBERG_ENABLED: "true"
      ICEBERG_CATALOG_NAME: polaris
      POLARIS_URI: http://polaris:8181/api/catalog
      POLARIS_WAREHOUSE: fraud
      POLARIS_CREDENTIAL: root:s3cr3t
      ICEBERG_S3_ENDPOINT: http://rustfs:9000
      ICEBERG_S3_ACCESS_KEY: rustfsadmin
      ICEBERG_S3_SECRET_KEY: rustfsadmin
  postgres:
    image: postgres:16.15-alpine3.23
    container_name: polaris-postgres
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: polaris-dev-password
    volumes:
      - polaris_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris -d polaris"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fraud-net]
    profiles: [lakehouse]
    restart: unless-stopped

  rustfs:
    # RustFS is the local S3-compatible development adapter. Apache Polaris
    # currently uses RustFS in its local quickstart; production uses cloud object storage.
    image: rustfs/rustfs:1.0.0-rc.6
    container_name: rustfs
    command: server /data --address "0.0.0.0:9000" --console-address "0.0.0.0:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - lakehouse_rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health && curl -fsS http://localhost:9001/rustfs/console/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [fraud-net]
    profiles: [lakehouse]
    restart: unless-stopped

  rustfs-init:
    image: amazon/aws-cli:2.36.44
    container_name: rustfs-init
    depends_on:
      rustfs: {condition: service_healthy}
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket iceberg >/dev/null 2>&1 ||
          aws --endpoint-url http://rustfs:9000 s3 mb s3://iceberg
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket mlflow-artifacts >/dev/null 2>&1 ||
          aws --endpoint-url http://rustfs:9000 s3 mb s3://mlflow-artifacts
        aws --endpoint-url http://rustfs:9000 s3 ls
    networks: [fraud-net]
    profiles: [lakehouse]

  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.7.0
    container_name: polaris-bootstrap
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: polaris-dev-password
    command: ["bootstrap", "-r", "POLARIS", "-c", "POLARIS,root,s3cr3t"]
    networks: [fraud-net]
    profiles: [lakehouse]

  polaris:
    image: apache/polaris:1.7.0
    container_name: polaris
    ports: ["8181:8181", "8182:8182"]
    depends_on:
      postgres: {condition: service_healthy}
      rustfs-init: {condition: service_completed_successfully}
      polaris-bootstrap: {condition: service_completed_successfully}
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: 5
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: polaris-dev-password
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      QUARKUS_OTEL_SDK_DISABLED: "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": '["S3"]'
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks: [fraud-net]
    profiles: [lakehouse]
    restart: unless-stopped

  polaris-setup:
    image: alpine/curl:8.22.0
    container_name: polaris-setup
    depends_on:
      polaris: {condition: service_healthy}
    environment:
      POLARIS_URI: http://polaris:8181/api/catalog
      POLARIS_CREDENTIAL: root:s3cr3t
      POLARIS_SCOPE: PRINCIPAL_ROLE:ALL
      POLARIS_TOKEN_URI: http://polaris:8181/api/catalog/v1/oauth/tokens
      POLARIS_WAREHOUSE: fraud
      POLARIS_REALM: POLARIS
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      CATALOG_NAME: fraud
      CLIENT_ID: root
      CLIENT_SECRET: s3cr3t
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        TOKEN=$$(curl -fsS -u "$${CLIENT_ID}:$${CLIENT_SECRET}" \
          -d 'grant_type=client_credentials' \
          -d 'scope=PRINCIPAL_ROLE:ALL' \
          http://polaris:8181/api/catalog/v1/oauth/tokens | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
        RESPONSE=$$(curl -sS -o /tmp/catalog.json -w '%{http_code}' \
          -X POST http://polaris:8181/api/management/v1/catalogs \
          -H "Authorization: Bearer $$TOKEN" \
          -H 'Polaris-Realm: POLARIS' \
          -H 'Content-Type: application/json' \
          -d '{"catalog":{"name":"'"$${CATALOG_NAME}"'","type":"INTERNAL","readOnly":false,"properties":{"default-base-location":"s3://iceberg"},"storageConfigInfo":{"storageType":"S3","allowedLocations":["s3://iceberg"],"endpoint":"http://rustfs:9000","endpointInternal":"http://rustfs:9000","pathStyleAccess":true,"region":"us-east-1"}}}')
        case "$$RESPONSE" in
          200|201|409) echo "Polaris catalog '$${CATALOG_NAME}' ready (HTTP $$RESPONSE)" ;;
          *) cat /tmp/catalog.json >&2; exit 1 ;;
        esac
    networks: [fraud-net]
    profiles: [lakehouse]

  trino:
    image: trinodb/trino:483
    container_name: trino
    ports: ["8080:8080"]
    environment:
      CLIENT_ID: root
      CLIENT_SECRET: s3cr3t
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    depends_on:
      polaris-setup: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [fraud-net]
    profiles: [lakehouse]
    restart: unless-stopped

volumes:
  lakehouse_rustfs_data:
  polaris_postgres_data: