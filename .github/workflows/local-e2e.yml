name: Local Decision-Path E2E
# Docker-free: train -> promote -> score through the real process_batch.
# Catches breakage in the ML/streaming path that unit tests and static checks miss.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "processing/**"
      - "ingestion/generator/**"
      - "scripts/local_e2e.py"
      - "config/**"
      - "requirements*.txt"
permissions:
  contents: read
jobs:
  local-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/local_e2e.py
        env:
          SPARK_LOCAL_IP: 127.0.0.1
