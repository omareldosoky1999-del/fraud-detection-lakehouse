name: Promote Fraud Ensemble

on:
  workflow_dispatch:
    inputs:
      expected_run_id:
        description: MLflow run ID to promote
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MLflow client
        run: |
          python -m pip install --disable-pip-version-check mlflow==3.16.0 pyyaml

      - name: Promote validated ensemble
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          test -n "$MLFLOW_TRACKING_URI"
          python scripts/promote_ensemble.py \
            --tracking-uri "$MLFLOW_TRACKING_URI" \
            --expected-run-id "${{ inputs.expected_run_id }}"
