name: Monitoring Validation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "monitoring/**"
      - "docker/docker-compose.yml"
      - "tests/test_monitoring_config.py"
      - ".github/workflows/monitoring-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            -v "${PWD}/monitoring:/etc/prometheus:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Prometheus rules
        run: |
          docker run --rm \
            -v "${PWD}/monitoring:/etc/prometheus:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.5.0 \
            check rules /etc/prometheus/alerts.yml /etc/prometheus/rules/recording.yml

      - name: Validate Alertmanager configuration
        run: |
          docker run --rm \
            -v "${PWD}/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            --entrypoint /bin/amtool \
            prom/alertmanager:v0.29.0 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Validate Compose monitoring profile
        run: |
          docker compose -f docker/docker-compose.yml --profile monitoring config --quiet

      - name: Run monitoring tests
        run: |
          python -m pip install --disable-pip-version-check pyyaml pytest
          python -m pytest tests/test_monitoring_config.py -q
