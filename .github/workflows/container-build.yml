name: Container Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Container tag
        required: true
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  spark-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Spark application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/spark-app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fraud-detection-lakehouse/spark-app:${{ inputs.tag }}
            ghcr.io/${{ github.repository_owner }}/fraud-detection-lakehouse/spark-app:${{ github.sha }}
