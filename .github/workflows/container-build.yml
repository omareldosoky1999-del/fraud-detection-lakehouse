name: Container Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Container tag for a manual build
        required: false
        default: manual
  push:
    branches: [main]
    paths:
      - "docker/spark-app/**"
      - "docker/spark/requirements-spark.txt"
      - "common/**"
      - "config/**"
      - "ingestion/**"
      - "processing/**"
      - ".github/workflows/container-build.yml"
  pull_request:
    paths:
      - "docker/spark-app/**"
      - "docker/spark/requirements-spark.txt"
      - "common/**"
      - "config/**"
      - "ingestion/**"
      - "processing/**"
      - ".github/workflows/container-build.yml"

permissions:
  contents: read
  packages: write

jobs:
  spark-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER}/fraud-detection-lakehouse/spark-app"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            {
              echo "tags<<EOF"
              echo "${repo}:latest"
              echo "${repo}:sha-${GITHUB_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            manual_tag="${{ inputs.tag || 'pr-' }}${GITHUB_SHA:0:12}"
            {
              echo "tags<<EOF"
              echo "${repo}:${manual_tag}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and conditionally push Spark application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/spark-app/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
