name: Quality E2E

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "docker/docker-compose.yml"
      - "docker/spark/**"
      - "processing/quality/**"
      - "scripts/gx_silver_smoke.py"
      - "scripts/validate_silver_quality.py"
      - "tests/test_gx_validation.py"
      - "config/platform.yml"
      - ".github/workflows/quality-e2e.yml"

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Start Spark and HDFS
        run: |
          docker compose -f docker/docker-compose.yml up -d --build

      - name: Initialize HDFS Spark workspace
        run: bash scripts/init_hdfs_dirs.sh

      - name: Generate valid Silver partition
        run: |
          docker exec spark-master             /opt/spark/bin/spark-submit             --master spark://spark-master:7077             /app/scripts/gx_silver_smoke.py

      - name: Run Great Expectations Silver gate
        run: |
          docker exec spark-master             python3 /app/scripts/validate_silver_quality.py             --date 2026-09-01             --path hdfs://namenode:8020/warehouse/silver/transactions             --report /app/reports/dq/e2e-silver-validation.json

      - name: Assert validation report
        run: |
          docker exec spark-master             python3 -c "import json; p=json.load(open('/app/reports/dq/e2e-silver-validation.json')); assert p['success'] is True; print(p)"

      - name: Capture logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --no-color --tail=500

      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
