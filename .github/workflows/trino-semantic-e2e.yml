name: Trino Semantic E2E

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "docker/docker-compose.yml"
      - "docker/docker-compose.lakehouse.yml"
      - "docker/trino/**"
      - "warehouse/trino/**"
      - "scripts/trino_semantic_smoke.py"
      - ".github/workflows/trino-semantic-e2e.yml"

jobs:
  semantic-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Start Lakehouse stack
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.lakehouse.yml \
            --profile lakehouse up -d --build

      - name: Wait for Trino
        run: bash scripts/wait_for_trino.sh

      - name: Seed production-shaped Iceberg tables
        run: |
          docker exec spark-master \
            /opt/spark/bin/spark-submit \
            --master spark://spark-master:7077 \
            /app/scripts/trino_semantic_smoke.py

      - name: Apply Trino semantic layer
        run: |
          docker cp warehouse/trino/semantic_views.sql trino:/tmp/semantic_views.sql
          docker exec trino trino --server http://localhost:8080 --file /tmp/semantic_views.sql

      - name: Validate semantic queries
        run: |
          docker exec trino trino --server http://localhost:8080 --execute "SELECT count(*) AS rows FROM polaris.analytics.fraud_transaction_risk WHERE decision = 'FLAG' AND ml_probability > 0.9"
          docker exec trino trino --server http://localhost:8080 --execute "SELECT event_date, total_transactions, flagged_transactions FROM polaris.analytics.daily_fraud_kpis"
          docker exec trino trino --server http://localhost:8080 --execute "SELECT client_id, last_decision, last_ml_probability FROM polaris.analytics.client_risk_summary WHERE client_id = 10"
          docker exec trino trino --server http://localhost:8080 --execute "SELECT feature_rows, new_device_rate, country_change_rate FROM polaris.analytics.fraud_feature_monitoring WHERE event_date = DATE '2026-09-01'"

      - name: Capture logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.lakehouse.yml \
            --profile lakehouse logs --no-color --tail=500

      - name: Tear down
        if: always()
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.lakehouse.yml \
            --profile lakehouse down -v
