name: Rollback Fraud Ensemble

on:
  workflow_dispatch:
    inputs:
      target_run_id:
        description: Validated MLflow training run ID to restore
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MLflow client
        run: |
          python -m pip install --disable-pip-version-check \
            mlflow==3.16.0 \
            pyyaml

      - name: Roll back validated ensemble
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          test -n "$MLFLOW_TRACKING_URI"
          python scripts/rollback_ensemble.py \
            --tracking-uri "$MLFLOW_TRACKING_URI" \
            --target-run-id "${{ inputs.target_run_id }}"
