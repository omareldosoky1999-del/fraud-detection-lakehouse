name: Full-Stack Fraud E2E
# Heavy integration gate: manual or weekly. Layer-specific E2Es remain push-triggered.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"
jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Start full local platform
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.lakehouse.yml \
            -f docker/docker-compose.mlflow.yml \
            --profile lakehouse --profile mlops --profile serving up -d --build

      - name: Show service status
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.lakehouse.yml \
            -f docker/docker-compose.mlflow.yml \
            --profile lakehouse --profile mlops --profile serving ps

      - name: Initialize HDFS workspace
        run: bash scripts/init_hdfs_dirs.sh

      - name: Create Kafka topics
        run: docker exec kafka bash /kafka-scripts/create-topics.sh kafka:9092

      - name: Wait for HBase readiness
        run: |
          for i in $(seq 1 60); do
            if docker exec hbase bash -lc "curl -fsS http://localhost:16010/master-status >/dev/null 2>&1 && echo 'status' | hbase shell -n >/dev/null 2>&1"; then
              exit 0
            fi
            sleep 2
          done
          docker logs hbase
          exit 1

      - name: Wait for serving API
        run: |
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8095/health && exit 0
            sleep 3
          done
          docker logs serving-api
          exit 1

      - name: Train candidate fraud ensemble
        run: |
          docker exec spark-master bash -lc '
            set -o pipefail
            /opt/spark/bin/spark-submit \
              --master spark://spark-master:7077 \
              /app/processing/ml/train.py \
              --n 5000 \
              --tracking-uri http://mlflow:5000 \
              --promote-alias candidate \
              --ml-threshold 0.70 \
              2>&1 | tee /tmp/fraud-training.log
          '

      - name: Resolve training run id
        id: run
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(docker exec spark-master bash -lc "grep '\\[MLFLOW\\] run_id=' /tmp/fraud-training.log | tail -1 | sed 's/.*run_id=//'" )
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Resolved MLflow run: $run_id"

      - name: Promote candidate ensemble to production
        run: |
          docker exec spark-master \
            /opt/spark/bin/spark-submit \
            --master spark://spark-master:7077 \
            /app/scripts/promote_ensemble.py \
            --tracking-uri http://mlflow:5000 \
            --expected-run-id "${{ steps.run.outputs.run_id }}"

      - name: Start fraud streaming job
        run: |
          docker exec -d spark-master bash -lc '
            rm -rf /tmp/full-stack-stream.log
            nohup /opt/spark/bin/spark-submit \
              --master spark://spark-master:7077 \
              /app/processing/streaming/bronze_silver_job.py \
              --topic transactions \
              --alerts-topic fraud.alerts \
              --trigger "2 seconds" \
              --max-offsets-per-trigger 500 \
              > /tmp/full-stack-stream.log 2>&1
          '
          sleep 10
          docker exec spark-master bash -lc 'tail -80 /tmp/full-stack-stream.log || true'

      - name: Install host producer dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'confluent-kafka[avro,schemaregistry]>=2.3' \
            fastavro PyYAML

      - name: Produce labeled Kafka Avro workload
        run: |
          python ingestion/producer/transaction_producer.py \
            --n 1500 \
            --speed 0 \
            --start 2026-09-01T10:00:00 \
            --flush-every 100 \
            --reset \
            --checkpoint /tmp/full-stack-producer-checkpoint.json \
            --labels-out /tmp/full-stack-ground-truth.csv

      - name: Wait for Trino
        run: bash scripts/wait_for_trino.sh

      - name: Verify Iceberg transaction decisions through Trino
        run: |
          for i in $(seq 1 40); do
            count=$(docker exec trino trino --server http://localhost:8080 --execute "SELECT count(*) FROM polaris.gold.fraud_decisions" --output-format CSV_HEADER=false 2>/dev/null | tr -d '\r' || true)
            echo "decision_rows=$count"
            if [ "${count:-0}" -gt 0 ]; then exit 0; fi
            sleep 3
          done
          docker exec spark-master bash -lc 'tail -200 /tmp/full-stack-stream.log || true'
          exit 1

      - name: Build Gold aggregates and dual-write Iceberg Gold
        run: |
          docker exec spark-master \
            /opt/spark/bin/spark-submit \
            --master spark://spark-master:7077 \
            /app/processing/batch/build_gold.py \
            --date 2026-09-01 \
            --lookback-days 1

      - name: Verify Gold aggregates through Trino
        run: |
          kpis=$(docker exec trino trino --server http://localhost:8080 --execute \
            "SELECT total_txns FROM polaris.gold.daily_kpis WHERE event_date = DATE '2026-09-01'" \
            --output-format CSV_HEADER=false | tr -d '\r')
          echo "gold_daily_kpis=$kpis"
          [ -n "$kpis" ]
          [ "$kpis" -gt 0 ]

      - name: Verify semantic analytics view
        run: |
          docker cp warehouse/trino/semantic_views.sql trino:/tmp/semantic_views.sql
          docker exec trino trino --file /tmp/semantic_views.sql
          non_pass=$(docker exec trino trino --server http://localhost:8080 --execute \
            "SELECT count(*) FROM polaris.analytics.fraud_transaction_risk WHERE decision <> 'PASS'" \
            --output-format CSV_HEADER=false | tr -d '\r')
          scored=$(docker exec trino trino --server http://localhost:8080 --execute \
            "SELECT count(*) FROM polaris.analytics.fraud_transaction_risk WHERE ml_probability IS NOT NULL" \
            --output-format CSV_HEADER=false | tr -d '\r')
          echo "non_pass=$non_pass scored_with_ml_probability=$scored"
          [ "${non_pass:-0}" -gt 0 ]
          [ "${scored:-0}" -gt 0 ]

      - name: Evaluate end-to-end fraud decisions
        run: |
          docker exec spark-master bash -lc "rm -rf /tmp/full-stack-decisions && hdfs dfs -get /warehouse/gold/fraud_decisions /tmp/full-stack-decisions"
          python scripts/evaluate_rules.py \
            --decisions /tmp/full-stack-decisions \
            --labels /tmp/full-stack-ground-truth.csv \
            --out /tmp/full-stack-fraud-report.txt
          grep -E 'precision=|recall=|f1=' /tmp/full-stack-fraud-report.txt

      - name: Verify alert consumer deduplication
        run: |
          for i in $(seq 1 30); do
            count=$(docker exec alert-consumer python -c "import sqlite3; c=sqlite3.connect('/data/alerts.db'); print(c.execute('select count(*) from alerts').fetchone()[0])" 2>/dev/null || echo 0)
            echo "stored_alerts=$count"
            if [ "${count:-0}" -gt 0 ]; then exit 0; fi
            sleep 2
          done
          docker logs alert-consumer
          exit 1

      - name: Verify HBase serving API has client state
        run: |
          client=$(docker exec trino trino --server http://localhost:8080 --execute \
            "SELECT min(client_id) FROM polaris.gold.fraud_decisions" \
            --output-format CSV_HEADER=false | tr -d '\r')
          test -n "$client"
          echo "selected_client=$client"
          code=$(curl -s -o /tmp/client.json -w '%{http_code}' "http://localhost:8095/v1/clients/$client")
          cat /tmp/client.json || true
          test "$code" = "200"

      - name: Show pipeline logs on failure
        if: failure()
        run: |
          docker exec spark-master bash -lc 'tail -300 /tmp/full-stack-stream.log || true'
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.lakehouse.yml \
            -f docker/docker-compose.mlflow.yml \
            --profile lakehouse --profile mlops --profile serving logs --no-color --tail=500

      - name: Tear down
        if: always()
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.lakehouse.yml \
            -f docker/docker-compose.mlflow.yml \
            --profile lakehouse --profile mlops --profile serving down -v
