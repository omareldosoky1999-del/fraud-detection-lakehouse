name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Java (required by pyspark)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -c "import pyspark; print('PySpark runtime:', pyspark.__version__)"

      - name: Python syntax checks
        run: python -m compileall -q ingestion processing scripts orchestration

      - name: YAML configuration checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = [
              Path("config/fraud_rules.yml"),
              Path("config/ml_models.yml"),
              Path("config/quality/silver.yml"),
              Path("config/storage_profiles.yml"),
              Path("config/platform.yml"),
          ]
          for path in files:
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"YAML OK: {path}")
          PY

      - name: Static platform validation
        run: python scripts/validate_stack.py

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker/docker-compose.yml config --quiet
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.lakehouse.yml --profile lakehouse config --quiet
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.lakehouse.yml -f docker/docker-compose.mlflow.yml --profile lakehouse --profile mlops config --quiet

      - name: Helm lint
        uses: azure/setup-helm@v5

      - name: Render Kubernetes chart with production-style overrides
        run: |
          helm template fraud-platform deploy/helm/fraud-platform             -f deploy/helm/fraud-platform/values-aws.yaml             --set image.immutableTag=sha-ci             --set runtimeSecret.existingSecret=fraud-platform-runtime             > /tmp/fraud-platform.yaml
          grep -q 'kind: SparkApplication' /tmp/fraud-platform.yaml
          grep -q 'sha-ci' /tmp/fraud-platform.yaml
          grep -q 'secretRef:' /tmp/fraud-platform.yaml

      - name: Render Helm chart with ExternalSecret enabled
        run: |
          helm template fraud-platform deploy/helm/fraud-platform             -f deploy/helm/fraud-platform/values-aws.yaml             --set externalSecrets.enabled=true             --set-string image.immutableTag=sha-ci             > /tmp/fraud-platform-external-secret.yaml
          grep -q 'kind: ExternalSecret' /tmp/fraud-platform-external-secret.yaml
          grep -q 'fraud-platform-runtime' /tmp/fraud-platform-external-secret.yaml
          grep -q 'ClusterSecretStore' /tmp/fraud-platform-external-secret.yaml

      - name: Lint Kubernetes chart
        run: helm lint deploy/helm/fraud-platform

      - name: Run tests
        run: python -m pytest tests -q

      - name: Rules-engine precision/recall report (informational)
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from datetime import datetime
          from processing.common.spark_session import get_spark
          from processing.streaming.transform import to_silver
          from processing.rules.rules_engine import apply_rules
          from ingestion.generator.transaction_generator import generate, write_labels
          import pandas as pd

          events = generate(10000, seed=1, start=datetime(2026, 9, 1), data_dir='ingestion/data')
          write_labels(events, '/tmp/labels.csv')
          spark = get_spark('ci-eval', enable_hive=False)
          silver = to_silver(spark.createDataFrame([e.rec for e in events]))
          apply_rules(silver).write.mode('overwrite').parquet('/tmp/decisions')
          spark.stop()
          "
          python scripts/evaluate_rules.py --decisions /tmp/decisions --labels /tmp/labels.csv
