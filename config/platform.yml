# Canonical platform versions.

runtime:
  spark: "3.5.9"
  python: "3.11"
  java: "17"

lakehouse:
  iceberg: "1.11.0"
  catalog: "polaris"
  polaris: "1.7.0"
  local_object_store: "rustfs"
  rustfs: "1.0.0-rc.6"
  metadata_db: "postgres:16.15-alpine3.23"

query:
  engine: "trino"
  trino: "483"

mlops:
  tracking: mlflow
  mlflow: "3.16.0"
  registry: true
  artifact_store: "s3-compatible"

identity:
  aws: "eks_pod_identity"
  azure: "aks_workload_identity"
  gcp: "gke_workload_identity_federation"

lineage:
  backend: "marquez"
  openlineage: "1.53.0"
  marquez: "0.51.1"
  airflow_provider: "1.14.0"

quality:
  framework: "great_expectations"
  great_expectations: "1.23.2"
  validation_stage: silver_to_gold
