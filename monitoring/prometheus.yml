global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: spark-fraud-driver
    metrics_path: /metrics
    static_configs:
      - targets: ["spark-master:8000"]

  # Airflow/HBase/Hive do not expose Prometheus endpoints in this single-host
  # academic stack. Their health and application logs remain the source of
  # truth until dedicated exporters/JMX are introduced.
