global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # Local development deliberately has no external notification sink.
    # Cloud deployments can replace this receiver with Slack, PagerDuty,
    # email, SNS, Teams, or another governed notification endpoint.
