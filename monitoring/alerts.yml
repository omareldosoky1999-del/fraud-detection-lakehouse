groups:
  - name: fraud-platform-slos
    interval: 30s
    rules:
      - alert: FraudDecisionPipelineDown
        expr: up{job="spark-fraud-driver"} == 0
        for: 2m
        labels:
          severity: critical
          service: fraud-streaming
        annotations:
          summary: "Fraud decision pipeline metrics endpoint is down"
          description: "The Spark fraud driver metrics endpoint has been unavailable for more than two minutes."

      - alert: FraudBatchP95TooSlow
        expr: histogram_quantile(0.95, sum(rate(fraud_batch_duration_seconds_bucket[5m])) by (le)) > 30
        for: 5m
        labels:
          severity: warning
          service: fraud-streaming
        annotations:
          summary: "Fraud streaming micro-batch latency is high"
          description: "The 95th percentile micro-batch duration is above 30 seconds."

      - alert: FraudQuarantineRateHigh
        expr: |
          (
            sum(rate(fraud_quarantined_total[5m]))
            /
            clamp_min(sum(rate(fraud_decisions_total[5m])), 1)
          ) > 0.10
        for: 10m
        labels:
          severity: warning
          service: data-quality
        annotations:
          summary: "Silver quarantine rate is above 10%"
          description: "More than 10% of processed decision rows are entering quarantine over the last 10 minutes."

      - alert: FraudAlertRateSpike
        expr: |
          (
            sum(rate(fraud_alerts_total[5m]))
            /
            clamp_min(sum(rate(fraud_decisions_total[5m])), 1)
          ) > 0.25
        for: 10m
        labels:
          severity: warning
          service: fraud-decisioning
        annotations:
          summary: "Fraud alert rate is above 25% of decisions"
          description: "The proportion of decisions producing alerts is unusually high."

      - alert: FraudAlertConsumerLagHigh
        expr: sum(kafka_consumergroup_lag_sum{consumergroup="fraud-alert-sink"}) > 1000
        for: 10m
        labels:
          severity: warning
          service: alert-consumer
        annotations:
          summary: "Fraud alert consumer lag is high"
          description: "The fraud alert sink consumer group is more than 1000 messages behind."

      - alert: FraudFeaturePipelineStalled
        expr: rate(fraud_feature_rows_total[5m]) == 0 and rate(fraud_decisions_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
          service: feature-engineering
        annotations:
          summary: "Fraud feature materialization has stalled"
          description: "Decisions are flowing while the shared feature layer reports no rows."
