environment:
  name: gcp
  namespace: fraud-platform

env:
  ICEBERG_FILEIO_IMPL: org.apache.iceberg.gcp.gcs.GCSFileIO
  POLARIS_URI: https://polaris.example.internal/api/catalog
  MLFLOW_TRACKING_URI: https://mlflow.example.internal
  OPENLINEAGE_URL: https://marquez.example.internal
runtimeSecret:
  existingSecret: fraud-platform-runtime
serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: fraud-spark@PROJECT_ID.iam.gserviceaccount.com
  podLabels: {}
  podLabels: {}

externalSecrets:
  enabled: false
  secretStoreRef:
    name: fraud-platform-gcp-secrets
    kind: ClusterSecretStore
  targetName: fraud-platform-runtime
  refreshInterval: 1h
  data:
    POLARIS_CREDENTIAL: polaris-credential
