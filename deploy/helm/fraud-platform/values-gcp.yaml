environment:
  name: gcp
  namespace: fraud-platform

env:
  # Requires the GCS Hadoop connector jar in the image before first deploy.
  STREAMING_CHECKPOINT: gs://fraud-platform-checkpoints-example/checkpoints/bronze_silver
  ICEBERG_FILEIO_IMPL: org.apache.iceberg.gcp.gcs.GCSFileIO
  POLARIS_URI: https://polaris.example.internal/api/catalog
  POLARIS_TOKEN_URI: https://polaris.example.internal/api/catalog/v1/oauth/tokens
  MLFLOW_TRACKING_URI: https://mlflow.example.internal
  OPENLINEAGE_URL: https://marquez.example.internal
  LEGACY_HDFS_ENABLED: "false"
  HBASE_HOST: ""

runtimeSecret:
  existingSecret: fraud-platform-runtime

serviceAccount:
  annotations: {}
  podLabels: {}
  cloudIdentity:
    gcpServiceAccount: ""

externalSecrets:
  enabled: false
  secretStoreRef:
    name: fraud-platform-gcp-secrets
    kind: ClusterSecretStore
  targetName: fraud-platform-runtime
  refreshInterval: 1h
  data:
    POLARIS_CREDENTIAL: polaris-credential
