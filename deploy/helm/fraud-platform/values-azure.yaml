environment:
  name: azure
  namespace: fraud-platform

env:
  # Requires hadoop-azure jars + abfss auth in the image before first deploy.
  STREAMING_CHECKPOINT: abfss://checkpoints@examplestorage.dfs.core.windows.net/bronze_silver
  ICEBERG_FILEIO_IMPL: org.apache.iceberg.azure.adlsv2.ADLSFileIO
  POLARIS_URI: https://polaris.example.internal/api/catalog
  POLARIS_TOKEN_URI: https://polaris.example.internal/api/catalog/v1/oauth/tokens
  MLFLOW_TRACKING_URI: https://mlflow.example.internal
  OPENLINEAGE_URL: https://marquez.example.internal
  LEGACY_HDFS_ENABLED: "false"
  HBASE_HOST: ""

runtimeSecret:
  existingSecret: fraud-platform-runtime

serviceAccount:
  annotations: {}
  podLabels:
    azure.workload.identity/use: "true"
  cloudIdentity:
    azureClientId: ""

externalSecrets:
  enabled: false
  secretStoreRef:
    name: fraud-platform-azure-secrets
    kind: ClusterSecretStore
  targetName: fraud-platform-runtime
  refreshInterval: 1h
  data:
    POLARIS_CREDENTIAL: polaris-credential
